[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402", "E731", "E741"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pytest.ini_options]
# alpaca-py 0.44 imports the compatibility namespace while supporting multiple
# websockets releases. Glassbox does not import that deprecated namespace
# directly; keep all other deprecations visible.
filterwarnings = [
    "ignore:websockets\\.legacy is deprecated.*:DeprecationWarning:websockets\\.legacy",
]
