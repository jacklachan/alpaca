name: CI

# Judged criterion: Technology Implementation. A green badge is evidence that
# the risk kernel's invariants and the crash-recovery guarantees hold on every
# commit, rather than on the one laptop where they were last run by hand.

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and drills
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Unit tests
        run: python -m pytest -q

      # These two are the reason CI exists. The kernel is the only thing
      # standing between a hallucinated plan and a real order, and the crash
      # drill is the evidence behind "runs unattended for four days".
      - name: Risk kernel invariants
        run: python -m pytest tests/test_kernel.py -q -v

      - name: Crash-recovery drill
        run: python tools/crash_drill.py -n 8 --seed 1

      # A .env that systemd and python-dotenv read differently silently
      # disabled the scored-account guards once. Never again, unnoticed.
      - name: Environment parity (.env.example)
        run: python tools/env_parity.py .env.example

      - name: Dashboard starts and serves
        run: |
          python -m uvicorn dashboard.app:app --host 127.0.0.1 --port 8080 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz
          curl -sf http://127.0.0.1:8080/ | grep -q "Glass"
          curl -sf http://127.0.0.1:8080/api/summary | grep -q chain_ok
          echo "dashboard OK"

  guards:
    name: Competition guards
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Cheap checks for the mistakes that cost the whole competition rather
      # than one test.
      - name: No credentials committed
        run: |
          if git ls-files | grep -qx '.env'; then
            echo "::error::.env is tracked by git"; exit 1
          fi
          if git grep -nE '\b(PK[A-Z0-9]{18,}|sk-ant-[A-Za-z0-9-]{20,})' \
               -- ':!*.md' ':!.github/*' ; then
            echo "::error::a live-looking API key is committed"; exit 1
          fi
          echo "no credentials in the tree"

      - name: Paper-trading guard is intact
        run: |
          grep -q 'NotPaperTrading' glassbox/broker.py
          grep -q 'startswith("PK")' glassbox/broker.py
          echo "paper-only guards present"

      - name: Sleeve budgets sum to starting equity
        run: |
          python - <<'PY'
          from glassbox import config as C
          total = C.CORE_SLEEVE_USD + C.CONVEX_SLEEVE_USD + C.CRYPTO_SLEEVE_USD
          assert total == C.STARTING_EQUITY, f"sleeves sum to {total}"
          assert C.EVENT_TRADE_DAILY_CAP <= C.CONVEX_TOTAL_PREMIUM_CAP
          print(f"sleeves OK: {total}")
          PY

      - name: Measurement date matches Alpaca's guidelines
        run: |
          python - <<'PY'
          from glassbox.macro import (MEASUREMENT_ET, MEASUREMENT_IS_CONFIRMED,
                                      next_event, post_measurement_events)
          from datetime import datetime
          from glassbox import config as C
          assert MEASUREMENT_IS_CONFIRMED, "measurement date is still unconfirmed"
          assert (MEASUREMENT_ET.date().isoformat() == "2026-09-03"), MEASUREMENT_ET
          # Payrolls must stay excluded: it resolves after the snapshot.
          names = {e.name for e in post_measurement_events()}
          assert any("Employment Situation" in n for n in names), names
          thu = datetime(2026, 9, 3, 14, 30, tzinfo=C.ET)
          assert next_event(thu, tier=1, within_hours=48) is None
          print("measurement window guards OK")
          PY
